<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACS Studio — Gallery</title>
  <link rel="stylesheet" href="/studio/fonts/inter.css" />
  <link rel="stylesheet" href="../studio.css?v=31" />
</head>
<body>
<div class="studio">
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="logo-acs">ACS</span><span class="logo-sub">STUDIO</span></div>
    <nav class="nav-section">
      <div class="nav-group-label">Criar</div>
      <a class="nav-item" href="/studio/image"><span class="nav-ic">◻</span>Image<span class="nav-badge">BETA</span></a>
      <a class="nav-item" href="/studio/video"><span class="nav-ic">▶</span>Video</a>
      <a class="nav-item" href="/studio/audio"><span class="nav-ic">♪</span>Audio</a>
      <a class="nav-item" href="/studio/motion"><span class="nav-ic">⟳</span>Motion</a>
      <div class="nav-group-label" style="margin-top:8px">Biblioteca</div>
      <a class="nav-item" href="/studio/assets"><span class="nav-ic">▣</span>Assets</a>
      <a class="nav-item active" href="/studio/gallery"><span class="nav-ic">◈</span>Gallery</a>
      <div class="nav-group-label" style="margin-top:8px">Sistema</div>
      <a class="nav-item" href="/studio/settings"><span class="nav-ic">⚙</span>Settings</a>
      <a class="nav-item" href="/studio/update"><span class="nav-ic">↑</span>Update</a>
    </nav>
    <div class="sidebar-foot"><div class="sys-status"><span class="sys-dot"></span>Sistema Online</div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar-title">Gallery</span>
      <span class="topbar-sep"></span>
      <span class="topbar-sub" id="gallery-count">Carregando...</span>
      <div class="topbar-right">
        <button class="topbar-pill">◉ Licença Ativa</button>
        <button class="topbar-pill">AC ▾</button>
      </div>
    </header>
    <div class="gallery-page" id="gallery-page">
      <!-- preenchido por gallery.js -->
    </div>
    <!-- Lightbox — B38-008: suporte image/video/audio -->
    <div class="gallery-lightbox" id="gallery-lightbox" style="display:none">
      <div class="gallery-lb-backdrop" id="gallery-lb-backdrop"></div>
      <div class="gallery-lb-content">
        <button class="gallery-lb-close" id="gallery-lb-close">✕</button>
        <button class="gallery-lb-prev" id="gallery-lb-prev">‹</button>
        <!-- image -->
        <img class="gallery-lb-img" id="gallery-lb-img" src="" alt="" style="display:none;" />
        <!-- video / audio (inserido dinamicamente pelo JS) -->
        <div id="gallery-lb-media" style="display:none;align-items:center;justify-content:center;width:100%;"></div>
        <button class="gallery-lb-next" id="gallery-lb-next">›</button>
        <div class="gallery-lb-info" id="gallery-lb-info"></div>
        <div class="gallery-lb-actions">
          <button class="preview-action-btn" id="gallery-lb-download">↓ Download</button>
          <button class="preview-action-btn" id="gallery-lb-open">↗ Abrir</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./gallery.js?v=4"></script>
  <script src="/studio/license-gate.js?v=1" defer></script>
</body>
</html>
